<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#080e1e" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#7000ff" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="30" fill="url(#bgGrad)" />

  <!-- Cybernetic Grid / Rings -->
  <circle cx="200" cy="180" r="140" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="6,6" />
  <circle cx="200" cy="180" r="115" fill="none" stroke="#00f0ff" stroke-opacity="0.25" stroke-width="2" />
  <circle cx="200" cy="180" r="95" fill="none" stroke="#7000ff" stroke-opacity="0.3" stroke-width="1" />

  <!-- Holographic Silhouette Base -->
  <g filter="url(#glow)">
    <!-- Shoulders -->
    <path d="M 120 330 C 120 260, 160 245, 200 245 C 240 245, 280 260, 280 330 Z" fill="url(#cyanGrad)" fill-opacity="0.2" stroke="#00f0ff" stroke-width="2" />
    <!-- Neck -->
    <path d="M 185 220 L 215 220 L 210 245 L 190 245 Z" fill="#00f0ff" fill-opacity="0.3" />
    <!-- Head / Face Outline -->
    <ellipse cx="200" cy="175" rx="52" ry="62" fill="#091427" stroke="url(#cyanGrad)" stroke-width="3" />
    <!-- Tech Visor / AI Nodes -->
    <path d="M 160 165 C 180 160, 220 160, 240 165 C 235 180, 165 180, 160 165 Z" fill="#00f0ff" fill-opacity="0.85" filter="url(#glow)" />
    <!-- Digital nodes on face -->
    <circle cx="175" cy="195" r="3" fill="#00f0ff" />
    <circle cx="200" cy="205" r="3" fill="#7000ff" />
    <circle cx="225" cy="195" r="3" fill="#00f0ff" />
    <line x1="175" y1="195" x2="200" y2="205" stroke="#00f0ff" stroke-opacity="0.4" stroke-width="1" />
    <line x1="200" y1="205" x2="225" y2="195" stroke="#00f0ff" stroke-opacity="0.4" stroke-width="1" />
  </g>

  <!-- Golden Chip Badge Overlay at bottom -->
  <g transform="translate(140, 335)">
    <rect width="120" height="30" rx="15" fill="#0b172a" stroke="url(#goldGrad)" stroke-width="1.5" />
    <text x="60" y="20" font-family="'Fira Code', monospace" font-size="12" font-weight="bold" fill="#fbbf24" text-anchor="middle" letter-spacing="1.5">SUMIT • AI</text>
  </g>
</svg>
